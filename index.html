<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time & Routine Memory Game ⏰</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #2d3748; margin-bottom: 10px; }
        
        .shuffle-btn {
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            margin-bottom: 25px;
        }
        .shuffle-btn:hover { background-color: #38a169; transform: scale(1.05); }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            aspect-ratio: 3 / 4;
            perspective: 1000px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
        }

        .card-back {
            background: linear-gradient(135deg, #6b73ff 0%, #000dff 100%);
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .card-front {
            background-color: white;
            transform: rotateY(180deg);
            padding: 10px;
            box-sizing: border-box;
        }

        .card-front img {
            width: 100%;
            height: 70%;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .card-front .time-text {
            font-size: 22px;
            font-weight: 900;
            color: #2d3748;
            background: #edf2f7;
            padding: 2px 10px;
            border-radius: 5px;
            width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>What time is it? ⏰</h1>
    
    <button class="shuffle-btn" onclick="shuffleGame()">🔄 Shuffle Cards</button>
    
    <div class="grid-container" id="cardGrid"></div>

<script>
    // 1. 사용할 이미지 8개 (이미 깃허브에 올리신 파일명과 정확히 일치해야 함)
    const baseImages = [
        "get up.jpg", "exercise.jpg", "walk the dog.jpg", "get home.jpg", 
        "go to school.jpg", "have dinner.jpg", "take a bath.jpg", "go to bed.jpg"
    ];

    // 2. 요청하신 시간 리스트 전체 (총 43개)
    const timePool = [
        "1:15", "1:20", "1:40", "1:50", "2:15", "2:20", "2:40", "2:50", 
        "3:15", "3:20", "3:40", "3:50", "4:30", "4:50", "5:30", "5:40", 
        "6:30", "6:40", "6:50", "7:30", "7:40", "7:50", "8:30", "8:40", 
        "8:50", "9:30", "9:40", "9:50", "10:15", "10:20", "10:30", "11:00", 
        "11:10", "11:20", "11:30", "11:40", "11:50", "12:00", "12:10", 
        "12:20", "12:30", "12:40", "12:50"
    ];

    const gridContainer = document.getElementById('cardGrid');

    function shuffleGame() {
        // 모든 카드를 뒷면으로 돌리기
        gridContainer.innerHTML = '';

        // 8개의 이미지를 3번씩 복사해서 24개 만들기
        let gameImages = [...baseImages, ...baseImages, ...baseImages];
        
        // 24개 이미지 무작위 섞기
        gameImages.sort(() => Math.random() - 0.5);

        // 시간 풀에서 무작위로 24개 뽑아서 섞기
        let gameTimes = [...timePool].sort(() => Math.random() - 0.5).slice(0, 24);

        // 카드 생성
        for (let i = 0; i < 24; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = function() { this.classList.toggle('flipped'); };
            
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <img src="${gameImages[i]}" alt="activity">
                        <div class="time-text">${gameTimes[i]}</div>
                    </div>
                    <div class="card-back">${i + 1}</div>
                </div>
            `;
            gridContainer.appendChild(card);
        }
    }

    // 처음 시작할 때 게임 생성
    shuffleGame();
</script>

</body>
</html>
