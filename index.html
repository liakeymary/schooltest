<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Card Flip Game 🎮</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2d3748;
            margin-bottom: 20px;
        }
        /* 24개 카드를 정렬하는 바둑판 (가로 6개씩) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            max-width: 1000px;
            width: 100%;
        }
        /* 모바일 화면 대응 (화면이 작아지면 가로 3개씩) */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        /* 카드 3D 효과를 위한 설정 */
        .card {
            aspect-ratio: 3 / 4;
            perspective: 1000px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        /* 클릭해서 .flipped 클래스가 붙으면 뒤집어짐 */
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        /* 카드 앞면과 뒷면 공통 스타일 */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 10px;
        }
        /* 카드 뒷면 (처음에 보이는 면) */
        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #fff;
        }
        /* 카드 앞면 (클릭하면 보이는 면) */
        .card-front {
            background-color: white;
            color: #333;
            transform: rotateY(180deg);
            border: 2px solid #764ba2;
        }
        .card-front img {
            width: 80%;
            height: auto;
            max-height: 70%;
            object-fit: contain;
            border-radius: 5px;
            margin-bottom: 8px;
        }
        .card-front span {
            font-size: 14px;
            font-weight: bold;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <h1>Find the Activity! 🌟</h1>
    
    <div class="grid-container" id="cardGrid">
        </div>

<script>
    // 24개 카드에 들어갈 데이터 (우선 보내주신 이미지 이름과 텍스트로 채웠습니다)
    // 이미지 파일이 없는 9~24번은 우선 임시 텍스트로 처리해두었습니다.
    const cardData = [
        { id: 1, text: "Get up", img: "get up.jpg" },
        { id: 2, text: "Exercise", img: "exercise.jpg" },
        { id: 3, text: "Walk the dog", img: "walk the dog.jpg" },
        { id: 4, text: "Get home", img: "get home.jpg" },
        { id: 5, text: "Go to school", img: "go to school.jpg" },
        { id: 6, text: "Have dinner", img: "have dinner.jpg" },
        { id: 7, text: "Take a bath", img: "take a bath.jpg" },
        { id: 8, text: "Go to bed", img: "go to bed.jpg" },
        // 9번부터 24번까지 임시 데이터 (나중에 텍스트와 이미지를 바꾸시면 됩니다!)
        { id: 9, text: "Activity 9", img: "" }, { id: 10, text: "Activity 10", img: "" },
        { id: 11, text: "Activity 11", img: "" }, { id: 12, text: "Activity 12", img: "" },
        { id: 13, text: "Activity 13", img: "" }, { id: 14, text: "Activity 14", img: "" },
        { id: 15, text: "Activity 15", img: "" }, { id: 16, text: "Activity 16", img: "" },
        { id: 17, text: "Activity 17", img: "" }, { id: 18, text: "Activity 18", img: "" },
        { id: 19, text: "Activity 19", img: "" }, { id: 20, text: "Activity 20", img: "" },
        { id: 21, text: "Activity 21", img: "" }, { id: 22, text: "Activity 22", img: "" },
        { id: 23, text: "Activity 23", img: "" }, { id: 24, text: "Activity 24", img: "" }
    ];

    const gridContainer = document.getElementById('cardGrid');

    // 화면에 24개 카드 생성하기
    cardData.forEach(data => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // 클릭하면 뒤집히는 기능 토글 (한 번 더 누르면 다시 뒷면이 됨)
        card.onclick = function() {
            this.classList.toggle('flipped');
        };

        // 이미지 경로 설정 (이미지가 없으면 텍스트만 표시)
        const imgTag = data.img ? `<img src="${data.img}" alt="${data.text}">` : `<div style="font-size:40px; margin-bottom:10px;">❓</div>`;

        card.innerHTML = `
            <div class="card-inner">
                <div class="card-front">
                    ${imgTag}
                    <span>${data.text}</span>
                </div>
                <div class="card-back">
                    ${data.id}
                </div>
            </div>
        `;
        gridContainer.appendChild(card);
    });
</script>

</body>
</html>
