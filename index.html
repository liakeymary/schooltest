<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5학년 영어 루틴 게임 🎮</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #eef2f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 { color: #4a5568; margin-bottom: 10px; font-size: 24px; }
        p { color: #718096; margin-bottom: 25px; }
        .card-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background-color: #edf2f7;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #2d3748;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .card:hover {
            background-color: #e2e8f0;
            transform: translateY(-2px);
        }
        .card.correct {
            background-color: #c6f6d5;
            border-color: #48bb78;
            color: #22543d;
            cursor: default;
        }
        #message {
            font-size: 20px;
            font-weight: bold;
            height: 30px;
            margin-top: 15px;
        }
        .success-text { color: #38a169; }
        .error-text { color: #e53e3e; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Morning Routine Game ☀️</h1>
    <p>아침 루틴의 <b>올바른 순서대로</b> 카드를 클릭해보세요!</p>
    
    <div class="card-container">
        <div class="card" onclick="checkAnswer(this, 'Wash my face')">🧼 Wash my face</div>
        <div class="card" onclick="checkAnswer(this, 'Wake up')">⏰ Wake up</div>
        <div class="card" onclick="checkAnswer(this, 'Go to school')">🎒 Go to school</div>
        <div class="card" onclick="checkAnswer(this, 'Eat breakfast')">🍳 Eat breakfast</div>
    </div>

    <div id="message"></div>
</div>

<script>
    // 정답 순서 리스트
    const correctOrder = ['Wake up', 'Wash my face', 'Eat breakfast', 'Go to school'];
    let currentIndex = 0;

    function checkAnswer(element, action) {
        // 이미 맞춘 카드는 무시
        if (element.classList.contains('correct')) return;

        const messageDiv = document.getElementById('message');

        if (action === correctOrder[currentIndex]) {
            // 정답을 누른 경우
            element.classList.add('correct');
            currentIndex++;
            
            if (currentIndex === correctOrder.length) {
                messageDiv.innerHTML = "<span class='success-text'>🎉 미션 완료! 참 잘했어요! 🎉</span>";
            } else {
                messageDiv.innerHTML = "<span class='success-text'>정답입니다! 다음 단계는? 👍</span>";
            }
        } else {
            // 틀린 경우
            messageDiv.innerHTML = "<span class='error-text'>앗, 순서가 틀렸어요! 다시 생각해보세요. ❌</span>";
            setTimeout(() => {
                if(currentIndex < correctOrder.length) messageDiv.innerText = '';
            }, 1500);
        }
    }
</script>

</body>
</html>
